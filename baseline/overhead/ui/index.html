<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overhead Hit Check</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --ink:#1c1e21; --muted:#6b7280; --line:#e5e7eb; --misty:#0080ff; --cozmo:#00a650; --obst:#ff8c00; --hit:#e11d48; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0f1115; --panel:#171a21; --ink:#e7e9ee; --muted:#9aa3b2; --line:#2a2f3a; } }
  :root[data-theme="dark"] { --bg:#0f1115; --panel:#171a21; --ink:#e7e9ee; --muted:#9aa3b2; --line:#2a2f3a; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); background:var(--panel); display:flex; gap:16px; align-items:baseline; flex-wrap:wrap }
  header h1 { font-size:16px; margin:0 }
  header .sub { color:var(--muted) }
  main { display:grid; grid-template-columns: 340px 1fr; gap:0; min-height:calc(100vh - 50px) }
  aside { border-right:1px solid var(--line); background:var(--panel); overflow:auto; max-height:calc(100vh - 50px) }
  aside .filters { padding:10px 12px; border-bottom:1px solid var(--line); display:flex; gap:6px; flex-wrap:wrap }
  aside button, .ctl button { border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:6px; padding:4px 8px; cursor:pointer }
  aside button.on, .ctl button.on { background:var(--accent); color:#fff; border-color:var(--accent) }
  aside table { width:100%; border-collapse:collapse }
  aside th, aside td { padding:6px 8px; text-align:left; border-bottom:1px solid var(--line); font-size:12.5px }
  aside tr { cursor:pointer } aside tr:hover { background:rgba(37,99,235,.08) } aside tr.sel { background:rgba(37,99,235,.16) }
  .hit { color:var(--hit); font-weight:600 } .nohit { color:var(--muted) }
  section { padding:16px; display:flex; flex-direction:column; gap:12px; min-width:0 }
  .vidwrap { position:relative; background:#000; border-radius:8px; overflow:hidden; max-width:1280px }
  video { width:100%; display:block }
  canvas.overlay { position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none }
  .ctl { display:flex; gap:8px; align-items:center; flex-wrap:wrap; color:var(--muted) }
  .ctl input[type=range] { width:320px }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; max-width:1280px }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 10px }
  .card .k { color:var(--muted); font-size:12px } .card .v { font-size:18px; font-weight:600 }
  .chart { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px; max-width:1280px }
  .legend { display:flex; gap:14px; color:var(--muted); font-size:12px; flex-wrap:wrap }
  .legend i { display:inline-block; width:12px; height:12px; border-radius:2px; margin-right:4px; vertical-align:-2px }
  .frame { font-family:ui-monospace,Menlo,monospace; font-size:12px; color:var(--muted) }
  @media (max-width:900px) { main { grid-template-columns:1fr } aside { max-height:40vh; border-right:0; border-bottom:1px solid var(--line) } section { padding:12px 16px } }
</style>
</head>
<body>
<header>
  <h1>Overhead hit check</h1>
  <span class="sub">bird's-eye YOLO (misty / cozmo / obstacle) → distance / overlap → hit, time to first hit</span>
  <span class="sub" id="rule"></span>
</header>
<main>
  <aside>
    <div class="filters">
      <button class="on" data-f="all">all</button><button data-f="chaser">chaser</button><button data-f="evader">evader</button>
      <button data-f="hit">hit only</button><button data-f="nohit">no hit</button>
      <span id="count" style="color:var(--muted);align-self:center"></span>
    </div>
    <table><thead><tr><th>session</th><th>cond.</th><th>1st hit</th><th>det M/C</th></tr></thead><tbody id="rows"></tbody></table>
  </aside>
  <section>
    <div class="cards" id="cards"></div>
    <div class="vidwrap"><video id="v" controls playsinline></video><canvas id="ov" class="overlay"></canvas></div>
    <div class="ctl">
      <button id="prev">◀ frame</button><button id="next">frame ▶</button>
      <label><input type="checkbox" id="drawjson" checked> draw boxes from JSON (on top of the burned-in video)</label>
      <span class="frame" id="finfo"></span>
    </div>
    <div class="chart">
      <div class="legend"><span><i style="background:var(--accent)"></i>centre distance (px)</span><span><i style="background:var(--obst)"></i>edge gap (px)</span><span><i style="background:var(--hit)"></i>hit</span><span><i style="background:#999"></i>cond (single frame)</span><span>— dashed: dist threshold</span></div>
      <canvas id="ch" height="180"></canvas>
    </div>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
let index = [], cur = null, data = null, filt = 'all';
const fmt = x => x == null ? '–' : (typeof x === 'number' ? x.toFixed(x % 1 ? 2 : 0) : x);

async function load() {
  index = await (await fetch('results/index.json?' + Date.now())).json();
  const p = index[0]?.params || {};
  $('#rule').textContent = `rule: gap ≤ ${p.gap_px}px or dist ≤ ${p.dist_px}px for ${p.hit_frames} consecutive frames (conf ${p.conf}, imgsz ${p.imgsz})`;
  render();
  const h = location.hash.slice(1);
  select(index.find(i => i.name === h) || index[0]);
}
function render() {
  const rows = index.filter(i => filt === 'all' || i.robot === filt || (filt === 'hit' && i.first_hit) || (filt === 'nohit' && !i.first_hit));
  $('#count').textContent = `${rows.length}/${index.length}`;
  $('#rows').innerHTML = rows.map(i => `<tr data-n="${i.name}" class="${cur && cur.name === i.name ? 'sel' : ''}">
    <td>${i.robot} · ${i.session.split('/').pop().slice(9, 15)}</td><td>${i.condition.replace('상대방 움직임 없음','').replace('misty_stop_','')}</td>
    <td class="${i.first_hit ? 'hit' : 'nohit'}">${i.first_hit ? i.time_to_first_hit_s.toFixed(2) + 's' : '–'}</td>
    <td>${i.misty_detected}/${i.frames} · ${i.cozmo_detected}/${i.frames}</td></tr>`).join('');
  document.querySelectorAll('#rows tr').forEach(tr => tr.onclick = () => select(index.find(i => i.name === tr.dataset.n)));
}
document.querySelectorAll('aside .filters button').forEach(b => b.onclick = () => { filt = b.dataset.f; document.querySelectorAll('aside .filters button').forEach(x => x.classList.toggle('on', x === b)); render(); });

async function select(i) {
  if (!i) return;
  cur = i; location.hash = i.name; render();
  data = await (await fetch('results/' + i.name + '.json')).json();
  const s = data.summary;
  $('#cards').innerHTML = [
    ['time to first hit', s.first_hit ? s.time_to_first_hit_s.toFixed(2) + ' s' : 'no hit'],
    ['first-hit frame', s.first_hit ? '#' + s.first_hit.frame_idx : '–'],
    ['hit frames', `${s.hit_frames} / ${s.frames}`], ['duration', s.duration_s.toFixed(1) + ' s'],
    ['misty detected', `${s.misty_detected}/${s.frames}`], ['cozmo detected', `${s.cozmo_detected}/${s.frames}`],
    ['min centre dist', s.min_dist == null ? '–' : s.min_dist + ' px'], ['processing', s.fps_processing + ' fps']
  ].map(([k, v]) => `<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
  const v = $('#v'); v.src = 'results/' + s.video; v.load();
  drawChart();
}
function frameAt(t) {  // frame index for video time t (video is written at constant fps, frames in order)
  const fr = data.frames; if (!fr.length) return 0;
  const fps = fr.length / Math.max(data.summary.duration_s, 0.01);
  // video timestamps are uniform; map video time → frame index by position
  return Math.min(fr.length - 1, Math.max(0, Math.round(t * (fr.length / $('#v').duration || fps))));
}
function drawOverlay() {
  const v = $('#v'), c = $('#ov'); if (!data || !v.videoWidth) return;
  c.width = v.videoWidth; c.height = v.videoHeight;
  const g = c.getContext('2d'); g.clearRect(0, 0, c.width, c.height);
  const k = frameAt(v.currentTime), r = data.frames[k];
  $('#finfo').textContent = r ? `frame ${k} (${r.frame})  t=${r.t.toFixed(2)}s  dist=${fmt(r.dist)}  gap=${fmt(r.gap)}  iou=${fmt(r.iou)}  cond=${r.cond}  hit=${r.hit}` : '';
  if (!r || !$('#drawjson').checked) return;
  const box = (b, col, lab, dash) => { g.lineWidth = 3; g.strokeStyle = col; g.setLineDash(dash ? [8, 6] : []); g.strokeRect(b[0], b[1], b[2] - b[0], b[3] - b[1]); g.setLineDash([]); g.fillStyle = col; g.font = 'bold 16px sans-serif'; g.fillText(lab, b[0], Math.max(14, b[1] - 6)); };
  r.obstacles.forEach(o => box(o, getComputedStyle(document.documentElement).getPropertyValue('--obst'), 'obstacle ' + o[4].toFixed(2)));
  for (const n of ['misty', 'cozmo']) if (r[n]) box(r[n].box, n === 'misty' ? '#0080ff' : '#00a650', `${n} ${r[n].conf.toFixed(2)}${r[n].held ? ' held' : ''}`, r[n].held > 0);
  if (r.hit) { g.lineWidth = 14; g.strokeStyle = '#e11d48'; g.strokeRect(0, 0, c.width, c.height); }
  drawChart(k);
}
function drawChart(k = -1) {
  const c = $('#ch'); c.width = c.parentElement.clientWidth - 16; const g = c.getContext('2d');
  const W = c.width, H = c.height, fr = data.frames, n = fr.length, p = data.summary.params;
  g.clearRect(0, 0, W, H); if (!n) return;
  const maxv = Math.max(p.dist_px * 1.5, ...fr.map(r => r.dist || 0)) || 1;
  const x = i => 40 + (W - 50) * i / Math.max(n - 1, 1), y = v => H - 18 - (H - 30) * v / maxv;
  g.fillStyle = 'rgba(153,153,153,.25)'; fr.forEach((r, i) => { if (r.cond) g.fillRect(x(i), 12, Math.max(1, (W - 50) / n), H - 30); });
  g.fillStyle = 'rgba(225,29,72,.45)'; fr.forEach((r, i) => { if (r.hit) g.fillRect(x(i), 12, Math.max(1, (W - 50) / n), H - 30); });
  g.strokeStyle = '#999'; g.setLineDash([4, 4]); g.beginPath(); g.moveTo(40, y(p.dist_px)); g.lineTo(W - 10, y(p.dist_px)); g.stroke(); g.setLineDash([]);
  const line = (key, col) => { g.strokeStyle = col; g.lineWidth = 1.5; g.beginPath(); let pen = false; fr.forEach((r, i) => { if (r[key] == null) { pen = false; return; } pen ? g.lineTo(x(i), y(r[key])) : g.moveTo(x(i), y(r[key])); pen = true; }); g.stroke(); };
  line('dist', '#2563eb'); line('gap', '#ff8c00');
  g.fillStyle = getComputedStyle(document.body).color; g.font = '11px sans-serif';
  g.fillText(maxv.toFixed(0) + 'px', 2, 20); g.fillText('0', 2, H - 18); g.fillText('0s', 40, H - 4); g.fillText(fr[n - 1].t.toFixed(1) + 's', W - 40, H - 4);
  if (k >= 0) { g.strokeStyle = '#e11d48'; g.lineWidth = 2; g.beginPath(); g.moveTo(x(k), 10); g.lineTo(x(k), H - 16); g.stroke(); }
  if (!c.onclick) c.onclick = e => { const i = Math.round((e.offsetX - 40) / (W - 50) * (n - 1)); const v = $('#v'); v.currentTime = Math.max(0, Math.min(v.duration, i / n * v.duration)); };
}
const v = $('#v');
v.addEventListener('timeupdate', drawOverlay); v.addEventListener('seeked', drawOverlay); v.addEventListener('loadedmetadata', drawOverlay);
(function loop() { if (!v.paused) drawOverlay(); requestAnimationFrame(loop); })();
$('#prev').onclick = () => { v.pause(); v.currentTime = Math.max(0, v.currentTime - v.duration / data.frames.length); };
$('#next').onclick = () => { v.pause(); v.currentTime = Math.min(v.duration, v.currentTime + v.duration / data.frames.length); };
window.addEventListener('resize', () => data && drawChart());
load();
</script>
</body>
</html>
